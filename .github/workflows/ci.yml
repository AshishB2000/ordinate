name: CI build check

# Fast per-push sanity gate: install deps, type-check + compile the TypeScript
# tree, run the node self-checks. Catches a broken commit immediately. The
# heavy installer build lives in build.yml (tags only) — this stays light.
#
# Watches `develop`, which is this repo's DEFAULT branch. This list has now gone
# stale TWICE, and both times the symptom was silence rather than a red check:
# it watched `dev` (never existed), then `devops` after the trunk was renamed to
# `develop`. Each time, every pull request merged without CI having run.
# Renaming the trunk means editing this list in the same commit.
#
# Node 24 matches what Electron 42 bundles, so the self-checks exercise the same
# runtime the app ships on. The DuckDB native binding is a prebuilt N-API module
# and resolves per-platform from npm, so no rebuild step is needed here.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  check:
    name: Install + parse + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Type-check + compile TypeScript
        # The whole tree is .ts (in-place sibling emit) — tsc strict is the
        # parse+type gate; there are no tracked runtime .js files left to check.
        run: npm run build:ts
      - name: Run self-checks
        run: npm test

  smoke:
    name: App smoke test (real Electron)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      # Electron needs the same shared libraries Chromium does (libnss3, libgbm,
      # libasound2, …). Playwright ships the exact list, so borrow it rather than
      # hand-maintaining an apt-get line that rots with each ubuntu image bump.
      - name: Install Electron's system libraries
        run: npx playwright install-deps chromium
      # No display on a CI runner, and Electron will not start without one.
      - name: Run the smoke test under a virtual display
        run: xvfb-run -a npm run smoke
        env:
          SMOKE_ARTIFACT_DIR: ${{ runner.temp }}
      # Upload the screenshot ALWAYS — on a failure it is the only way to see
      # what the app actually looked like when it broke.
      - name: Upload the window screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-window-screenshot
          path: ${{ runner.temp }}/app-window.png
          if-no-files-found: warn
