name: CI build check

# Fast per-push sanity gate: install deps, type-check + compile the TypeScript
# tree, run the node self-checks. Catches a broken commit immediately. The
# heavy installer build lives in build.yml (tags only) — this stays light.
#
# Watches `develop`, which is this repo's DEFAULT branch. This list has now gone
# stale TWICE, and both times the symptom was silence rather than a red check:
# it watched `dev` (never existed), then an earlier trunk name before the rename
# to `develop`. Each time, every pull request merged without CI having run.
# Renaming the trunk means editing this list in the same commit.
#
# Node 24 matches what Electron 42 bundles, so the self-checks exercise the same
# runtime the app ships on. The DuckDB native binding is a prebuilt N-API module
# and resolves per-platform from npm, so no rebuild step is needed here.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  check:
    name: Install + parse + tests
    runs-on: ubuntu-latest
    # The metadata DB (Phase 7, T3.1). scripts/test-db-*.ts create and drop
    # their own scratch databases on it; without DATABASE_URL they skip.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ordinate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Type-check + compile TypeScript
        # The whole tree is .ts (in-place sibling emit) — tsc strict is the
        # parse+type gate; there are no tracked runtime .js files left to check.
        run: npm run build:ts
      # S3 storage (Phase 7, T5.2): MinIO for scripts/test-storageS3.ts and the
      # S3 pass of test-serverModeResident (both skip without STORAGE_URL=s3://).
      # A step rather than a `services:` entry because a service container cannot
      # be given MinIO's `server` command. The suites create their bucket.
      # minio/minio is gone from Docker Hub (pull access denied); Chainguard's
      # build is public and multi-arch. It runs as uid 65532 with no /data, so
      # the data dir lives under /tmp. The loop fails the step if it never starts.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            chainguard/minio:latest server /tmp/minio-data
          for i in $(seq 1 30); do curl -fs http://localhost:9000/minio/health/live && exit 0; sleep 1; done
          docker logs minio; exit 1
      # DuckDB reads S3 through httpfs + aws; the server only LOADs them, so
      # they are installed once here (the Docker image bakes them in, T7.1).
      - name: Install DuckDB extensions (httpfs, aws)
        run: node scripts/duckdb-extensions.js
      - name: Run self-checks
        run: npm test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/ordinate_test
          STORAGE_URL: s3://ordinate-ci
          S3_ENDPOINT: http://localhost:9000
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          DUCKDB_EXTENSION_DIR: ${{ github.workspace }}/.duckdb-extensions

  # The web app (Phase 7): build, initial-bundle budget, Vitest, then the
  # Playwright e2e (web/e2e/) against the BUILT server on a temp DATA_DIR seeded
  # with the sample project. Chromium only here; Firefox and WebKit run nightly
  # (e2e-nightly.yml). The e2e fails on any console error, page error or CSP
  # violation, and on a page load over its RPC budget.
  web:
    name: web (build, Vitest, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      # Root postinstall compiles the TypeScript tree, so src/server/main.js exists after this.
      - run: npm ci
      - run: npm --prefix web ci
      - name: Build the web app
        run: npm --prefix web run build
      - name: Initial JS bundle ≤ 300 KB gzip
        run: npm --prefix web run size
      - name: Vitest
        run: npm --prefix web test
      # Playwright's own Chromium build (the revision the pinned playwright
      # wants) plus the system libraries it needs.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: e2e (Chromium)
        run: npm --prefix web run e2e
      - name: Upload the e2e screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screens-chromium
          path: web/e2e/__screens__/*.png
          if-no-files-found: warn
          retention-days: 7

  # Four shards in parallel, balanced by scripts/smoke-durations.json — the
  # serial chain had grown past 40 minutes. Each smoke is killed by name after 10
  # minutes (scripts/run-smokes.ts) and the job after 60, so a hung app can
  # never again hold a runner for six hours. The console-error rule is inside
  # every smoke, unchanged.
  smoke:
    name: smoke (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      # Electron needs the same shared libraries Chromium does (libnss3, libgbm,
      # libasound2, …). Playwright ships the exact list, so borrow it rather than
      # hand-maintaining an apt-get line that rots with each ubuntu image bump.
      - name: Install Electron's system libraries
        run: npx playwright install-deps chromium
      # No display on a CI runner, and Electron will not start without one.
      - name: Run the smoke test under a virtual display
        run: npm run build && xvfb-run -a node scripts/run-smokes.js --shard ${{ matrix.shard }}/4
        env:
          SMOKE_ARTIFACT_DIR: ${{ runner.temp }}
      # Upload the screenshot ALWAYS — on a failure it is the only way to see
      # what the app actually looked like when it broke.
      #
      # continue-on-error, because this step must never decide whether the BUILD
      # passed. When the account's artifact storage quota is full the upload
      # fails with "Artifact storage quota has been hit", and without this the
      # whole smoke job goes red immediately after printing "All app smoke checks
      # passed." — a green test reported as a failure. That is worse than having
      # no artifact: it trains everyone to ignore a red smoke job, which is the
      # one job that catches a CSP violation or a blank render.
      # ALL the smoke screenshots, not just the final window: smoke-app writes
      # ~23 per-scenario diagnostic shots into SMOKE_ARTIFACT_DIR, and on a red
      # run those are what say WHICH scenario broke.
      - name: Upload the smoke screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots-${{ matrix.shard }}
          path: ${{ runner.temp }}/*.png
          if-no-files-found: warn
          # The default is 90 days. A ~400 KB screenshot per PR run, kept for
          # three months, is what filled the quota in the first place; nobody has
          # ever wanted last quarter's smoke screenshot.
          retention-days: 7

  # THE required check. Branch protection names one context, not four, so a
  # shard that is renamed or added cannot silently drop out of the gate: this
  # job fails unless every shard succeeded (a skipped or cancelled shard fails
  # it too).
  smoke-all:
    name: smoke (all shards)
    runs-on: ubuntu-latest
    needs: smoke
    if: always()
    steps:
      - name: Every shard passed
        run: test "${{ needs.smoke.result }}" = success
