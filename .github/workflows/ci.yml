name: CI build check

# Per-push gate: install deps, type-check + compile the TypeScript tree, run the
# node self-checks, build and test the web app, build the image and drive it
# under Compose and on kind, and audit the runtime dependencies. A green push to
# develop then publishes the :edge image (the `edge` job, through release.yml);
# versioned releases are release.yml on a tag.
#
# Watches `develop`, which is this repo's DEFAULT branch. This list has now gone
# stale TWICE, and both times the symptom was silence rather than a red check:
# it watched `dev` (never existed), then an earlier trunk name before the rename
# to `develop`. Each time, every pull request merged without CI having run.
# Renaming the trunk means editing this list in the same commit.
#
# Node 24 is the server image's runtime (deploy/Dockerfile), so the self-checks
# exercise the same runtime the server ships on. The DuckDB native binding is a
# prebuilt N-API module and resolves per-platform from npm, so no rebuild step
# is needed here.
#
# Actions are pinned to the commit of the release named beside each one;
# .github/dependabot.yml proposes the bumps.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

# A new push to a pull request supersedes the run before it. A push to the trunk
# is never cancelled: every merged commit keeps its own verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Install + parse + tests
    runs-on: ubuntu-latest
    # The metadata DB (Phase 7, T3.1). scripts/test-db-*.ts create and drop
    # their own scratch databases on it; without DATABASE_URL they skip.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ordinate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Type-check + compile TypeScript
        # The whole tree is .ts (in-place sibling emit) — tsc strict is the
        # parse+type gate; there are no tracked runtime .js files left to check.
        run: npm run build:ts
      # S3 storage (Phase 7, T5.2): MinIO for scripts/test-storageS3.ts and the
      # S3 pass of test-serverModeResident (both skip without STORAGE_URL=s3://).
      # A step rather than a `services:` entry because a service container cannot
      # be given MinIO's `server` command. The suites create their bucket.
      # minio/minio is gone from Docker Hub (pull access denied); Chainguard's
      # build is public and multi-arch. It runs as uid 65532 with no /data, so
      # the data dir lives under /tmp. The loop fails the step if it never starts.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            chainguard/minio:latest server /tmp/minio-data
          for i in $(seq 1 30); do curl -fs http://localhost:9000/minio/health/live && exit 0; sleep 1; done
          docker logs minio; exit 1
      # DuckDB reads S3 through httpfs + aws; the server only LOADs them, so
      # they are installed once here (the Docker image bakes them in, T7.1).
      - name: Install DuckDB extensions (httpfs, aws)
        run: node scripts/duckdb-extensions.js
      - name: Run self-checks
        run: npm test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/ordinate_test
          STORAGE_URL: s3://ordinate-ci
          S3_ENDPOINT: http://localhost:9000
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          DUCKDB_EXTENSION_DIR: ${{ github.workspace }}/.duckdb-extensions

  # The web app (Phase 7): build, initial-bundle budget, Vitest, then the
  # Playwright e2e (web/e2e/) against the BUILT server on a temp DATA_DIR seeded
  # with the sample project. Chromium only here; Firefox and WebKit run nightly
  # (e2e-nightly.yml). The e2e fails on any console error, page error or CSP
  # violation, and on a page load over its RPC budget.
  web:
    name: web (build, Vitest, e2e)
    runs-on: ubuntu-latest
    # Was 20 (a run took ~12 min, the e2e step ~9). The Postgres-backed specs add ~6 min,
    # view-only-routes' walk ~3.5 of it, so a run is ~19 min: 20 left no room.
    timeout-minutes: 25
    # The Postgres-backed specs (`grep -l DATABASE_URL web/e2e/*.e2e.ts`:
    # row access, view-only, embed, password and OIDC sign-in, notifications…)
    # skip without DATABASE_URL. Each creates and drops its own scratch
    # database, so the URL is the superuser's maintenance database.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      # Root postinstall compiles the TypeScript tree, so src/server/main.js exists after this.
      - run: npm ci
      - run: npm --prefix web ci
      - name: Build the web app
        run: npm --prefix web run build
      - name: Initial JS bundle ≤ 300 KB gzip
        run: npm --prefix web run size
      - name: Vitest
        run: npm --prefix web test
      # Playwright's own Chromium build (the revision the pinned playwright
      # wants) plus the system libraries it needs.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: e2e (Chromium)
        run: npm --prefix web run e2e
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      - name: Upload the e2e screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screens-chromium
          path: web/e2e/__screens__/*.png
          if-no-files-found: warn
          retention-days: 7

  # Known vulnerabilities in RUNTIME dependencies (Phase 7, T6.3): a high or
  # critical advisory fails the job. Dev-only packages are left out — they never
  # reach the server image or the browser. Reads only the lockfiles, so no
  # install. scripts/audit-gate.ts allows only the advisories on its short list
  # (unreachable, no fix in range — each reasoned in docs/phase-7-web/threat-model.md
  # §7, with a review date); a new one, an expired entry or a stale entry fails.
  # Node 24 runs the .ts directly (type stripping), so no build either.
  audit:
    name: npm audit (runtime, high = fail)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Server and web app dependencies
        run: node scripts/audit-gate.ts . web

  # The server image and the Compose stack (Phase 7, T7.1): build
  # deploy/Dockerfile, hold it under 600 MB, start deploy/docker-compose.yml
  # from a clean state (fresh volumes, generated secrets), then drive it with
  # web/e2e/compose.e2e.ts — sign in (password mode, the compose default: the
  # first-run setup code from the server's log creates the admin) → import a
  # CSV → chart → dashboard, failing on any console error.
  docker:
    name: docker (image, compose, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
      - name: Build the image
        run: docker build -f deploy/Dockerfile -t ordinate:local .
      - name: Image ≤ 600 MB
        run: |
          size=$(docker image inspect ordinate:local --format '{{.Size}}')
          echo "image size: $((size / 1000000)) MB"
          test "$size" -lt 600000000
      - name: Start the stack (clean volumes, generated secrets)
        working-directory: deploy
        run: |
          cp .env.example .env
          sed -i \
            -e "s|^ORDINATE_MASTER_KEY=$|ORDINATE_MASTER_KEY=$(openssl rand -base64 32)|" \
            -e "s|^POSTGRES_PASSWORD=$|POSTGRES_PASSWORD=$(openssl rand -hex 16)|" \
            -e "s|^MINIO_ROOT_PASSWORD=$|MINIO_ROOT_PASSWORD=$(openssl rand -hex 16)|" \
            -e "s|^ORDINATE_ADMIN_EMAIL=.*|ORDINATE_ADMIN_EMAIL=admin@ci.test|" .env
          docker compose down -v
          docker compose up -d --wait
      - name: /metrics is never on the app port
        run: test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/metrics)" = 404
      - name: The first-run setup code, from the server's log
        working-directory: deploy
        run: |
          for i in $(seq 30); do
            code=$(docker compose logs ordinate | grep -o 'First-run setup code: [A-Z0-9-]*' | head -n1 | cut -d' ' -f4)
            [ -n "$code" ] && break
            sleep 1
          done
          test -n "$code"
          echo "E2E_COMPOSE_SETUP_CODE=$code" >> "$GITHUB_ENV"
      # The spec needs only the `playwright` library from the root tree.
      - run: npm ci --ignore-scripts
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: e2e against the stack
        run: node --test --test-reporter=spec web/e2e/compose.e2e.ts
        env:
          E2E_COMPOSE_URL: http://127.0.0.1:8080
          E2E_COMPOSE_EMAIL: admin@ci.test
      - name: Stack logs
        if: failure()
        working-directory: deploy
        run: docker compose logs --no-color | tail -300
      - name: Upload the compose screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-screens
          path: web/e2e/__screens__/compose-*.png
          if-no-files-found: warn
          retention-days: 7

  # The Helm chart (Phase 7, T7.2): helm lint, then deploy/helm/ci/kind-e2e.sh on
  # a kind cluster (kind, kubectl and helm ship on the runner image) — the
  # locally built image, in-cluster Postgres + MinIO, helm install with the
  # pre-install migration hook, web/e2e/compose.e2e.ts through a port-forward,
  # a helm upgrade that must rerun the hook and roll the pods with /readyz
  # answering throughout, a drain the PDB must refuse, and the NetworkPolicy on.
  helm:
    name: helm (lint, kind, e2e, upgrade)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
      - run: helm version && kind version && kubectl version --client
      - name: Build the image
        run: docker build -f deploy/Dockerfile -t ordinate:local .
      # The spec needs only the `playwright` library from the root tree.
      - run: npm ci --ignore-scripts
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Chart on kind
        run: deploy/helm/ci/kind-e2e.sh
        env:
          IMAGE: ordinate:local
          KIND_CLUSTER: ordinate-ci
      - name: Cluster state
        if: failure()
        run: |
          kubectl --context kind-ordinate-ci -n ordinate get all,pdb,networkpolicy,events -o wide || true
          kubectl --context kind-ordinate-ci -n ordinate logs -l app.kubernetes.io/instance=ordinate --all-containers --tail=200 --prefix || true
      - name: Upload the screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: helm-screens
          path: web/e2e/__screens__/compose-*.png
          if-no-files-found: warn
          retention-days: 7

  # Migration numbers (src/server/db/migrations/NNNN_*.sql) are claimed by hand,
  # so two pull requests open at once can each add the same one and each pass
  # alone: two shipped 0014 that way (renumbered in bb2f9b0b). A pull request
  # that adds a number another OPEN pull request also adds fails here until one
  # of them renumbers — then re-run this job on the other; it asks GitHub
  # afresh rather than reading the checkout. A clash with the trunk itself needs
  # no job: the merge commit CI tests holds both files, and the loader refuses
  # two that share a version (`check`, test-db-migrate).
  migrations:
    name: migration numbers (no clash with an open PR)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      # The first step is the negative control for the pattern in the second:
      # if migrations move or are renamed, this fails instead of matching nothing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: src/server/db/migrations
      - run: ls src/server/db/migrations/[0-9][0-9][0-9][0-9]_*.sql > /dev/null
      - name: No other open pull request adds the same number
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          added() {
            gh api "repos/$GH_REPO/pulls/$1/files" --paginate --jq '.[] | select(.status == "added" or .status == "renamed") | .filename' \
              | sed -n 's|^src/server/db/migrations/\([0-9]\{4\}\)_.*\.sql$|\1|p' | sort -u
          }
          mine=$(added "$PR")
          if [ -z "$mine" ]; then echo "this pull request adds no migration"; exit 0; fi
          echo "this pull request adds: $(echo $mine)"
          bad=0
          for other in $(gh pr list --base "$BASE" --state open --limit 200 --json number --jq ".[].number | select(. != $PR)"); do
            clash=$(comm -12 <(echo "$mine") <(added "$other"))
            if [ -n "$clash" ]; then
              echo "::error::migration $(echo $clash) is also added by #$other: one of the two must take the next free number"
              bad=1
            fi
          done
          exit $bad

  # THE required check. Branch protection names one context, `smoke (all
  # shards)` — the name it kept from when it gathered the desktop app's smoke
  # shards (removed at the T8.1 cutover) — so the name stays, and the job now
  # gates on every job a pull request must pass: it fails unless each one
  # succeeded (a skipped or cancelled job fails it too).
  smoke-all:
    name: smoke (all shards)
    runs-on: ubuntu-latest
    needs: [check, web, docker, helm, audit, migrations]
    if: always()
    steps:
      - name: Every gating job passed
        run: |
          for r in "${{ needs.check.result }}" "${{ needs.web.result }}" "${{ needs.docker.result }}" "${{ needs.helm.result }}" "${{ needs.audit.result }}" "${{ needs.migrations.result }}"; do
            test "$r" = success
          done

  # CD. A push to develop that passed every gate above publishes
  # ghcr.io/<owner>/ordinate:edge through release.yml's own image job, so it is
  # built and booted on amd64 and arm64 exactly as a tagged release is. Versioned
  # releases stay on `v*` tags. `contents: write` is only the ceiling GitHub
  # demands because release.yml also holds the Release job (skipped here, but
  # checked when the run starts); the image job itself asks for `contents: read`.
  # ponytail: runs are per commit, so two merges seconds apart can publish out of
  # order and leave :edge one commit behind until the next merge. Queue the
  # trunk's runs in one concurrency group if that ever matters.
  edge:
    name: edge image
    needs: smoke-all
    if: github.event_name == 'push' && github.ref_name == 'develop'
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      edge: true
