name: Lint

# Two jobs with deliberately different weight:
#
#   lint      BLOCKING. `npm run lint` — oxlint with type-aware rules, over the
#             server (src, scripts), the published site's classic scripts
#             (src/publish/site, tsconfig.site.json) and the web app. The tree
#             is at zero findings; a new one fails the PR. This is the gate.
#
#   prettier  ADVISORY (continue-on-error). 238 files are not Prettier-formatted
#             and normalising them would be a whole-tree diff that buries real
#             review. It reports drift; it does not gate. Remove
#             continue-on-error in the same PR that formats the tree, not before
#             — an advisory job that can never go green is just noise.
#
# oxlint (not typescript-eslint) because this repo is on TypeScript 7, and
# typescript-eslint hard-refuses TS 7 at runtime — "typescript-eslint does not
# support TS 7.0", see typescript-eslint#10940. oxlint's type-aware engine is
# tsgolint, which is built on the TS 7 native compiler, so it is not a
# workaround here, it is the better fit.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

# A new push to a pull request supersedes the run before it. A push to the trunk
# is never cancelled: every merged commit keeps its own verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: oxlint (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci
      # web/tsconfig.json references vite/client types: the web/ lint pass needs web's deps.
      - run: npm --prefix web ci
      - run: npm run lint

  prettier:
    name: Prettier --check (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Report formatting drift (does not gate)
        continue-on-error: true
        run: npx --yes prettier@3 --check .
