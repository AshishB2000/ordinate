name: e2e nightly (Firefox, WebKit)

# The web e2e (web/e2e/) in the two browsers the per-PR job does not run —
# ci.yml's `web` job covers Chromium on every PR. Nightly because each engine
# adds a browser download and a full run; it also checks the Vite
# build.target guess (web/vite.config.ts) against real Firefox and Safari engines.
# A schedule runs on the default branch only, so there is no branch filter here.

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    # As in ci.yml's `web` job: the Postgres-backed specs skip without it.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm --prefix web ci
      - name: Build the web app
        run: npm --prefix web run build
      # --with-deps apt-installs the browser's system packages: 181 (117 MB) for
      # WebKit. On some runners the Ubuntu mirror trickles at ~40 KB/s, and that
      # download alone passed the 30-minute limit (Oct 26 and 27). The .debs come
      # from the Actions cache instead, one entry per runner image; apt fetches
      # only the versions the cache lacks. Saved right after the install, so a
      # failing spec later in the job does not skip the save.
      - id: image
        run: echo "version=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - id: apt
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-${{ matrix.browser }}-${{ steps.image.outputs.version }}
          restore-keys: apt-${{ matrix.browser }}-
      - name: Install ${{ matrix.browser }} for Playwright
        run: |
          mkdir -p ~/apt-archives
          sudo find ~/apt-archives -name '*.deb' -exec mv -t /var/cache/apt/archives {} +
          npx playwright install --with-deps ${{ matrix.browser }}
          # Drop .debs the mirror no longer offers, so the cache holds one set.
          sudo apt-get autoclean -qq
          cp /var/cache/apt/archives/*.deb ~/apt-archives/
      - if: steps.apt.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: ${{ steps.apt.outputs.cache-primary-key }}
      - name: e2e (${{ matrix.browser }})
        run: npm --prefix web run e2e
        env:
          E2E_BROWSER: ${{ matrix.browser }}
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      - name: Upload the e2e screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screens-${{ matrix.browser }}
          path: web/e2e/__screens__/*.png
          if-no-files-found: warn
          retention-days: 7

  # A red nightly is otherwise seen by nobody. One open issue per workflow: the
  # first failure opens it, each later one adds the run to it.
  report:
    name: Open an issue on failure
    needs: [e2e]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: Nightly e2e is failing
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          n=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "Failed again: $RUN"
          else
            gh issue create --title "$TITLE" --body "First failing run: $RUN"
          fi
