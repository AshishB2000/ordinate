name: e2e nightly (Firefox, WebKit)

# The web e2e (web/e2e/) in the two browsers the per-PR job does not run —
# ci.yml's `web` job covers Chromium on every PR. Nightly because each engine
# adds a browser download and a full run; it also checks the Vite
# build.target guess (web/vite.config.ts) against real Firefox and Safari engines.
# A schedule runs on the default branch only, so there is no branch filter here.

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm --prefix web ci
      - name: Build the web app
        run: npm --prefix web run build
      - name: Install ${{ matrix.browser }} for Playwright
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: e2e (${{ matrix.browser }})
        run: npm --prefix web run e2e
        env:
          E2E_BROWSER: ${{ matrix.browser }}
      - name: Upload the e2e screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-screens-${{ matrix.browser }}
          path: web/e2e/__screens__/*.png
          if-no-files-found: warn
          retention-days: 7

  # A red nightly is otherwise seen by nobody. One open issue per workflow: the
  # first failure opens it, each later one adds the run to it.
  report:
    name: Open an issue on failure
    needs: [e2e]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: Nightly e2e is failing
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          n=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "Failed again: $RUN"
          else
            gh issue create --title "$TITLE" --body "First failing run: $RUN"
          fi
