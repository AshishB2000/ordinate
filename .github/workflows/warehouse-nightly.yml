name: Warehouse nightly (Snowflake, BigQuery, ClickHouse, Cube, dbt)

# The two warehouse connectors against REAL accounts (docs/live-data/00-plan.md,
# L1.5): scripts/test-warehouseLive.ts, with credentials from repository
# secrets. The per-PR suites run the same code off recorded replies; this run
# says whether those recordings still match the services, and answers the
# BigQuery read-only scope spike in the run's summary. Each warehouse then runs
# the live-parity matrix (L2.8): every compiled statement through its runBound,
# compared with the extract path — over a fixture held in literals, so the
# accounts are never written — and then the Live calculated fields: 400
# formulas row by row against the formula engine, and the calc matrix at the
# same stride (semantic layer part 8, step 05). Each prints a `calcs:` line
# into the run's summary. With SNOWFLAKE_SEMANTIC_VIEW set (the view
# scripts/fixtures/snowflake-semantic-view.sql makes, once, by hand), Snowflake
# also runs the semantic parity matrix against that semantic view (semantic
# layer part 7, c1); without it, that part prints its skip.
#
# The `clickhouse` job runs the same matrix against a ClickHouse server in a
# service container (scripts/test-liveParityClickhouse.ts); it needs no secret.
# The `cube` job runs the semantic parity matrix against a Cube server over
# Postgres seeded with the same fixture (scripts/fixtures/cube/compose.yml, the
# image pinned by digest; scripts/test-semanticCubeLive.ts, semantic layer part
# 7, e1); it needs no secret either: the deployment's API secret is a fixture.
# The `dbt` job runs the semantic parity matrix against a dbt Cloud Semantic
# Layer (semantic layer part 7, d1, beta; scripts/test-semanticDbtLive.ts) with
# the DBT_SL_* secrets; until an account exists it prints that it skipped.
# Postgres, standing in for Redshift, runs it on every PR (ci.yml's `check`).
#
# Not a required check, and nothing else depends on it. Without the secrets (a
# fork, or before they are added) the script prints that it skipped and the job
# passes; with only some of one warehouse's secrets it fails, so a half-set
# configuration is not mistaken for a green run. What the accounts need and how
# to add the secrets: docs/server/live-data.md, "Testing against a real account".
#
# The log of a public repo is public: the script prints no credential and no
# identifier of the accounts (GitHub also masks every secret value), and its own
# secret canary fails the run if a key, token or passphrase reaches its output.
#
# Steps match ci.yml's `check` job (Node 24, npm ci, build:ts). A schedule runs
# on the default branch only, so there is no branch filter here.

on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Two runs at once would race each other's cancel checks on the same accounts.
concurrency:
  group: warehouse-nightly
  cancel-in-progress: false

jobs:
  live:
    name: Snowflake + BigQuery (real accounts)
    runs-on: ubuntu-latest
    # The connector checks take a few minutes; the parity matrix ~500 statements a warehouse, its calculated fields ~400 more.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Type-check + compile TypeScript
        run: npm run build:ts
      - name: Real-account checks
        run: node scripts/test-warehouseLive.js
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
          SNOWFLAKE_PAT: ${{ secrets.SNOWFLAKE_PAT }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
          SNOWFLAKE_SEMANTIC_VIEW: ${{ secrets.SNOWFLAKE_SEMANTIC_VIEW }}
          BIGQUERY_PROJECT: ${{ secrets.BIGQUERY_PROJECT }}
          BIGQUERY_KEY_JSON: ${{ secrets.BIGQUERY_KEY_JSON }}
          BIGQUERY_DATASET: ${{ secrets.BIGQUERY_DATASET }}
          BIGQUERY_LOCATION: ${{ secrets.BIGQUERY_LOCATION }}
          BIGQUERY_SCRATCH_DATASET: ${{ secrets.BIGQUERY_SCRATCH_DATASET }}

  clickhouse:
    name: Live parity on ClickHouse (container)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      clickhouse:
        # The LTS line the matrix was first run against (25.8, docs/live-data/log.md L2.8).
        image: clickhouse/clickhouse-server:25.8
        env:
          CLICKHOUSE_USER: parity
          CLICKHOUSE_PASSWORD: parity
        ports:
          - 8123:8123
        options: --ulimit nofile=262144:262144
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Type-check + compile TypeScript
        run: npm run build:ts
      - name: Wait for ClickHouse
        run: |
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8123/ping && exit 0; sleep 2; done
          echo "ClickHouse never answered on 8123"; exit 1
      - name: Live parity on ClickHouse
        run: node scripts/test-liveParityClickhouse.js
        env:
          CLICKHOUSE_URL: http://parity:parity@127.0.0.1:8123

  cube:
    name: Semantic parity on Cube (containers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Type-check + compile TypeScript
        run: npm run build:ts
      # Not job services: Cube reads the fixture's data model from the checkout, which services start before.
      - name: Start Postgres and Cube
        run: docker compose -f scripts/fixtures/cube/compose.yml up -d
      - name: Wait for Cube
        run: |
          for i in $(seq 1 90); do curl -fs http://127.0.0.1:4000/readyz && exit 0; sleep 2; done
          docker compose -f scripts/fixtures/cube/compose.yml logs; echo "Cube never became ready on 4000"; exit 1
      - name: Semantic parity on Cube
        run: node scripts/test-semanticCubeLive.js
        env:
          CUBE_URL: http://127.0.0.1:4000
          CUBE_API_SECRET: ordinate-cube-parity-not-a-secret
      - name: Cube's log, on failure
        if: failure()
        run: docker compose -f scripts/fixtures/cube/compose.yml logs cube | tail -200

  dbt:
    name: Semantic parity on dbt Cloud (beta; a real account)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Type-check + compile TypeScript
        run: npm run build:ts
      # Skips green without the three secrets; some but not all is a failure.
      - name: Semantic parity on dbt
        run: node scripts/test-semanticDbtLive.js
        env:
          DBT_SL_HOST: ${{ secrets.DBT_SL_HOST }}
          DBT_SL_ENVIRONMENT_ID: ${{ secrets.DBT_SL_ENVIRONMENT_ID }}
          DBT_SL_TOKEN: ${{ secrets.DBT_SL_TOKEN }}

  # A red nightly is otherwise seen by nobody. One open issue per workflow: the
  # first failure opens it, each later one adds the run to it.
  report:
    name: Open an issue on failure
    needs: [live, clickhouse, cube, dbt]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: Nightly warehouse run is failing
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          n=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "Failed again: $RUN"
          else
            gh issue create --title "$TITLE" --body "First failing run: $RUN"
          fi
