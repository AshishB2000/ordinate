{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled }}
# Scrapes the metrics Service (service.yaml: <release>-ordinate-metrics), never
# the app port. Its job label is that Service's name; prometheusrule.yaml's
# rules select it.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "ordinate.fullname" . }}
  labels:
    {{- include "ordinate.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "ordinate.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: metrics
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
{{- end }}
