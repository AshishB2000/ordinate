apiVersion: v1
kind: Service
metadata:
  name: {{ include "ordinate.fullname" . }}
  labels:
    {{- include "ordinate.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  # The app port only: the Ingress routes this Service, so /metrics is not on it.
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "ordinate.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
{{- if .Values.metrics.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ordinate.fullname" . }}-metrics
  labels:
    {{- include "ordinate.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
  {{- if .Values.metrics.annotations }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: {{ .Values.metrics.port | quote }}
    prometheus.io/path: /metrics
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
  selector:
    {{- include "ordinate.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
{{- end }}
