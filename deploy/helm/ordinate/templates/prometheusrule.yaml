{{- if .Values.metrics.prometheusRule.enabled }}
{{- $full := include "ordinate.fullname" . }}
{{- $sel := printf "namespace=%q,job=%q" .Release.Namespace (printf "%s-metrics" $full) }}
{{- $pod := printf "namespace=%q,pod=~%q,container=\"ordinate\"" .Release.Namespace (printf "%s-.*" $full) }}
{{- $rb := .Values.metrics.prometheusRule.runbookBaseUrl }}
# What saturates first, and what to do: docs/server/monitoring.md, one section per alert.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $full }}
  labels:
    {{- include "ordinate.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: ordinate
      rules:
        - alert: OrdinateDuckDBWaitHigh
          expr: |
            histogram_quantile(0.95, sum by (le, pod) (rate(ordinate_duckdb_wait_seconds_bucket{ {{- $sel -}} }[5m]))) > 5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: 'DuckDB calls on {{ "{{ $labels.pod }}" }} wait over 5 s (p95) before they start.'
            runbook_url: {{ $rb }}#duckdb-wait
        - alert: OrdinatePgPoolWaiting
          expr: |
            max by (pod) (ordinate_pg_pool_clients{ {{- $sel -}} ,state="waiting"}) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: 'Queries on {{ "{{ $labels.pod }}" }} wait for a Postgres connection.'
            runbook_url: {{ $rb }}#postgres-pool-waiting
        - alert: OrdinateEventLoopLag
          expr: |
            max by (pod) (ordinate_event_loop_delay_seconds{ {{- $sel -}} ,quantile="0.99"}) > 0.5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: 'The event loop on {{ "{{ $labels.pod }}" }} is blocked over 0.5 s (p99).'
            runbook_url: {{ $rb }}#event-loop-delay
        - alert: Ordinate5xxRatio
          expr: |
            (
              (sum(rate(ordinate_rpc_requests_total{ {{- $sel -}} ,code=~"5.."}[5m])) or vector(0))
              + (sum(rate(ordinate_http_requests_total{ {{- $sel -}} ,code=~"5.."}[5m])) or vector(0))
            )
            /
            (
              (sum(rate(ordinate_rpc_requests_total{ {{- $sel -}} }[5m])) or vector(0))
              + (sum(rate(ordinate_http_requests_total{ {{- $sel -}} }[5m])) or vector(0))
            ) > 0.05
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: 'Over 5 % of requests answer 5xx.'
            runbook_url: {{ $rb }}#5xx-ratio
        - alert: OrdinateMemoryNearLimit
          expr: |
            max by (pod) (container_memory_working_set_bytes{ {{- $pod -}} })
              / max by (pod) (kube_pod_container_resource_limits{ {{- $pod -}} ,resource="memory"}) > 0.9
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: '{{ "{{ $labels.pod }}" }} uses over 90 % of its memory limit.'
            runbook_url: {{ $rb }}#memory-near-the-limit
        - alert: OrdinateContainerRestarts
          expr: |
            increase(kube_pod_container_status_restarts_total{ {{- $pod -}} }[15m]) > 0
          labels:
            severity: warning
          annotations:
            summary: '{{ "{{ $labels.pod }}" }} restarted.'
            runbook_url: {{ $rb }}#container-restarts
{{- end }}
