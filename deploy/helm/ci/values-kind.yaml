# The chart's test values for kind (deploy/helm/ci/kind-e2e.sh): the locally
# built image, in-cluster Postgres + MinIO (deps.yaml), header sign-in.
image:
  pullPolicy: Never          # loaded with `kind load docker-image`
existingSecret: ordinate-secrets
config:
  # The e2e reaches the pod through `kubectl port-forward`, which connects from
  # the pod's own loopback: that is the "proxy" allowed to assert X-Forwarded-Email.
  AUTH_MODE: header
  TRUSTED_PROXY_CIDRS: "127.0.0.1/32,::1/128"
  ORDINATE_ADMIN_EMAIL: admin@ci.test
  STORAGE_URL: s3://ordinate
  S3_ENDPOINT: http://minio:9000
  DUCKDB_THREADS: "2"
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1536Mi
networkPolicy:
  # Turned on by the script's last step.
  enabled: false
  egress:
    - to: [{ podSelector: { matchLabels: { app: postgres } } }]
      ports: [{ port: 5432, protocol: TCP }]
    - to: [{ podSelector: { matchLabels: { app: minio } } }]
      ports: [{ port: 9000, protocol: TCP }]
