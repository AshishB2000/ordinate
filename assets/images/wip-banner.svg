<svg xmlns="http://www.w3.org/2000/svg" width="900" height="140" viewBox="0 0 900 140" role="img" aria-label="Work in progress — under active development">
  <defs>
    <pattern id="tape" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="20" height="40" fill="#111" />
      <rect x="20" width="20" height="40" fill="#ffc400" />
      <animateTransform attributeName="patternTransform" type="translate" additive="sum" from="0 0" to="40 0" dur="1.2s" repeatCount="indefinite" />
    </pattern>
    <clipPath id="r"><rect width="900" height="140" rx="16" /></clipPath>
  </defs>
  <style>
    .t { font: 900 46px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 4px; fill: #ffc400; animation: pulse 1.6s ease-in-out infinite; transform-origin: 450px 66px; }
    .s { font: 600 17px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: 1px; fill: #f5f5f5; }
    .dot { animation: blink 1.2s steps(1) infinite; }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <g clip-path="url(#r)">
    <rect width="900" height="140" fill="url(#tape)" />
    <rect x="0" y="18" width="900" height="104" fill="#111" />
    <text class="t" x="450" y="82" text-anchor="middle">🚧 WORK IN PROGRESS 🚧</text>
    <text class="s" x="450" y="108" text-anchor="middle">Under active development  <tspan class="dot" fill="#ffc400">●</tspan>   expect rough edges and breaking changes</text>
  </g>
</svg>
