<!-- Ordinate app icon — LIGHT.
     Cartesian axes with a value plotted high in the positive quadrant. An
     ordinate IS the y-coordinate: the height of a point above the x-axis, which
     is why the dot sits near the top-right corner rather than beside the origin.
     Geometry is on a 1024 grid: macOS Big Sur grid — an 824px tile centred in 1024 with a
     100px margin and a 22.37% corner radius, mark spans 45% of the tile, all coordinates land on whole pixels
     at 1024, 512, 256, 128 and 64. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eceef3"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#tile)"/>
  <g stroke="#131318" stroke-width="43" stroke-linecap="round">
    <path d="M512 327V697"/>
    <path d="M327 512H697"/>
  </g>
  <circle cx="639" cy="385" r="67" fill="#2563eb"/>
</svg>
