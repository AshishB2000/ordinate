<!-- Ordinate app icon — DARK. Same geometry; only the tile and the blues move.
     A faceted hexagonal frame around three ascending bars; the middle bar runs
     on past the others toward a notch that splits the bottom vertex.
     Traced from assets/icons/reference/cube-insight-200.png — every coordinate
     is a measurement off that bitmap mapped onto a 1024 grid (scale 5.12) and
     re-centred, because the source art sits 5% right of centre: invisible in a
     lockup, wrong in a dock icon.
     The frame is ONE path with fill-rule="evenodd" — outer hexagon, inner
     hexagon reversed, notch — so the notch shows the TILE through it. Painting
     a notch on top would be the wrong colour the moment the tile gradient or
     the dark variant changes. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Sampled around the ring at 15-degree steps: lightest at the top
         vertex, darkest at the lower-left face. That is a cube lit from above,
         and it is the only reason a flat frame reads as 3D. -->
    <linearGradient id="hex" x1="0.45" y1="0.02" x2="0.24" y2="0.91">
      <stop offset="0" stop-color="#63a6ff"/>
      <stop offset="0.5" stop-color="#2f80ff"/>
      <stop offset="1" stop-color="#1746cf"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="184" fill="#0e0e12"/>
  <path fill-rule="evenodd" fill="url(#hex)" d="M481.1 182.4 Q512.0 164.0 542.9 182.4 L798.1 334.6 Q829.0 353.0 829.0 389.0 L829.0 650.0 Q829.0 686.0 797.4 703.3 L543.6 842.7 Q512.0 860.0 480.4 842.7 L226.6 703.3 Q195.0 686.0 195.0 650.0 L195.0 389.0 Q195.0 353.0 225.9 334.6 Z M334.5 394.0 Q312.0 407.0 312.0 433.0 L312.0 591.0 Q312.0 617.0 334.5 630.0 L489.5 719.0 Q512.0 732.0 534.5 719.0 L689.5 630.0 Q712.0 617.0 712.0 591.0 L712.0 433.0 Q712.0 407.0 689.5 394.0 L534.5 305.0 Q512.0 292.0 489.5 305.0 Z M496.0 690.0 L528.0 690.0 L528.0 852.0 Q528.0 868.0 512.0 868.0 Q496.0 868.0 496.0 852.0 Z"/>
  <g fill="#3f8bff">
    <rect x="394" y="568" width="58" height="103" rx="29"/>
    <rect x="481" y="497" width="58" height="210" rx="29"/>
    <rect x="568" y="435" width="58" height="236" rx="29"/>
  </g>
</svg>
