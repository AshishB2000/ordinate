<!-- Ordinate mark — native vector with no tile. The faceted frame, three
     ascending bars, and open bottom split match the application icon.
     The Cube Insight mark: a faceted hexagonal frame around three ascending
     bars, the middle one running past the others into a notch that splits the
     bottom vertex.
     The path below is the approved MACHINE TRACE of the original supplied artwork,
     not a redrawing: the bitmap was 4x bilinear-upsampled, thresholded on
     blueness (b-r > 120), its pixel boundaries chained into loops, and each loop
     Douglas-Peucker simplified at 1.5/800 — about 1.9px of error once scaled to
     1024, which is invisible. An earlier hand-reconstruction from measurements
     got the frame right and the stem and notch visibly wrong; tracing the
     outline removes the judgement calls.
     The FRAME IS ONE LOOP, not two. The notch connects the inner region to the
     outside, so the frame has a single boundary — which is why this is
     fill-rule="evenodd" over four subpaths (frame + three bars) rather than an
     outer/inner pair.
     Re-centred on the hexagon: the source art sits 5% right of the image centre,
     invisible in a lockup and wrong in a dock icon. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Sampled off the reference around the ring at 15-degree steps:
         lightest at the top vertex, darkest on the lower-left face. That is a
         cube lit from above, and it is the only reason a flat frame reads as 3D. -->
    <linearGradient id="hex" x1="0.45" y1="0.02" x2="0.24" y2="0.91">
      <stop offset="0" stop-color="#63a6ff"/>
      <stop offset="0.5" stop-color="#2f80ff"/>
      <stop offset="1" stop-color="#1746cf"/>
    </linearGradient>
  </defs>
