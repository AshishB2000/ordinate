<!-- Ordinate mark, no tile — for in-app use, the README and any dark surface.
     Axes take `currentColor` so the mark inherits the surrounding text colour and
     works in both themes; only the plotted value is brand blue.
     Same proportions as the app icon: axes 45% of the frame, stroke 5.2%. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
  <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <path d="M12 5.4V18.6"/>
    <path d="M5.4 12H18.6"/>
  </g>
  <circle cx="16.6" cy="8.3" r="3.1" fill="#2563eb"/>
</svg>
