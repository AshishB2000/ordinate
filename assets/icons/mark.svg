<!-- Ordinate mark, no tile — the Cube Insight artwork lifted off its white
     tile by keying on blueness (b-r), so the anti-aliased edge survives and the
     tile and its drop shadow do not. The hexagon's inner field is TRANSPARENT
     rather than white, so the mark sits correctly on a dark surface too.
     The in-app copies use renderer/hub/logo.png, which is this same image —
     assets/ is excluded from the packaged asar. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <image x="0" y="0" width="24" height="24" href="data:image/png;base64,"/>
</svg>
