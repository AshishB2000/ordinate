# The Cube parity deployment (docs/live-data/cube.md): Postgres seeded with the live-parity fixture and a Cube
# server over it, for a local run and for the warehouse nightly's `cube` job:
#
#   docker compose -f scripts/fixtures/cube/compose.yml up -d
#   CUBE_URL=http://127.0.0.1:4000 CUBE_API_SECRET=ordinate-cube-parity-not-a-secret node scripts/test-semanticCubeLive.js
#   docker compose -f scripts/fixtures/cube/compose.yml down -v
#
# seed.sql and model/ are generated by scripts/cubeFixture.ts. The API secret is a test fixture, not a credential:
# the deployment holds only the fixture's rows and listens on 127.0.0.1.

services:
  postgres:
    # The Postgres line CI's Live suites run on.
    image: postgres:16
    environment:
      POSTGRES_USER: parity
      POSTGRES_PASSWORD: parity
      POSTGRES_DB: parity
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U parity -d parity']
      interval: 2s
      retries: 30

  cube:
    # Pinned by version and digest (the multi-arch manifest list, Docker Hub, 2026-11-05).
    image: cubejs/cube:v1.8.13@sha256:5a728f42924051b9499016fb1ac9d1695ab544084d57221c0dd173e4c730730a
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CUBEJS_DB_TYPE: postgres
      CUBEJS_DB_HOST: postgres
      CUBEJS_DB_PORT: '5432'
      CUBEJS_DB_NAME: parity
      CUBEJS_DB_USER: parity
      CUBEJS_DB_PASS: parity
      CUBEJS_API_SECRET: ordinate-cube-parity-not-a-secret
      CUBEJS_DEV_MODE: 'false'
    volumes:
      - ./model:/cube/conf/model:ro
    ports:
      - '127.0.0.1:4000:4000'
